[[agent]]
id = "grok"
label = "Grok"
mise = "grok"
launch = ["grok", "--permission-mode", "bypassPermissions"]
prompt_flag = "--"

[[agent]]
id = "claude"
label = "Claude"
mise = "claude"
launch = ["claude", "--permission-mode", "auto"]
prompt_flag = "--"

[[agent]]
id = "codex"
label = "Codex"
mise = "codex"
launch = ["codex", "--ask-for-approval", "never"]

[[agent]]
id = "opencode"
label = "OpenCode"
mise = "opencode"
launch = ["opencode", "--auto"]
prompt_flag = "--prompt"

[[agent]]
id = "copilot"
label = "Copilot"
mise = "copilot"
launch = ["copilot", "--allow-all"]

[[agent]]
id = "crush"
label = "Crush"
mise = "crush"
launch = ["crush", "--yolo"]
prompt_launch = ["crush", "run"]

[[agent]]
id = "pi"
label = "Pi"
mise = "pi"
launch = ["pi"]

[[agent]]
id = "cursor-agent"
label = "Cursor CLI"
mise = "cursor-agent"
launch = ["cursor-agent", "--force", "--trust"]
prompt_launch = ["cursor-agent", "--force", "--trust", "agent", "--"]

[[agent]]
id = "agy"
label = "Antigravity"
mise = "antigravity-cli"
launch = ["agy", "--dangerously-skip-permissions"]
prompt_flag = "--prompt-interactive"

[[agent]]
id = "omp"
label = "Oh My Pi"
mise = "github:can1357/oh-my-pi"
launch = ["omp", "--auto-approve"]
prompt_flag = "--"

[[agent]]
id = "ori"
label = "Ori"
mise = "ori"
launch = ["ori", "code"]
prompt_launch = ["ori", "code", "--interactive", "--prompt"]
